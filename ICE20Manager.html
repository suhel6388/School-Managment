<title>ICE School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark navy sidebar + light work area (ICE dashboard reference), mega-menu overlay for Quick Links */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#f3f5fb; --card:#ffffff; --ink:#0f1b3d; --mut:#62708c; --line:#e4e8f2; --inp:#ffffff; --hover:#f0f4ff;
  --pri:#2563eb; --pri2:#1d4ed8; --priSoft:#e8efff; --ok:#15803d; --okSoft:#dcfce7; --warn:#b45309; --warnSoft:#fef3c7;
  --bad:#b91c1c; --badSoft:#fee2e2; --vio:#7c3aed; --org:#ea580c;
  --side:#0b1636; --side2:#16255a; --sideInk:#c9d3ee; --shadow:0 1px 2px rgba(15,27,61,.06),0 4px 14px rgba(15,27,61,.05);
  --tilePri:#2563eb; --tileGrn:#059669; --tileOrg:#ea580c; --tileVio:#7c3aed;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020; --card:#121a33; --ink:#e8edf9; --mut:#9aa7c4; --line:#232e50; --inp:#0d1530; --hover:#1a2547;
  --pri:#5b8cff; --pri2:#7aa2ff; --priSoft:#1b2a5c; --ok:#4ade80; --okSoft:#12351f; --warn:#fbbf24; --warnSoft:#3a2c0b;
  --bad:#f87171; --badSoft:#3b1414; --side:#070d20; --side2:#14224d; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020; --card:#121a33; --ink:#e8edf9; --mut:#9aa7c4; --line:#232e50; --inp:#0d1530; --hover:#1a2547;
  --pri:#5b8cff; --pri2:#7aa2ff; --priSoft:#1b2a5c; --ok:#4ade80; --okSoft:#12351f; --warn:#fbbf24; --warnSoft:#3a2c0b;
  --bad:#f87171; --badSoft:#3b1414; --side:#070d20; --side2:#14224d; --shadow:none; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* login */
.login{height:100%;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#0b1636,#1d3a8a)}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:28px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lcard h1{font-size:22px}
.brandrow{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:10px;background:#f5b301;display:grid;place-items:center;color:#0b1636;font-weight:800;font-size:15px;flex:none}
.lerr{color:var(--bad);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--mut)}
/* app shell */
#app{display:flex;height:100%}
#side{width:264px;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;flex:none;transition:margin .2s;overflow:hidden}

.sq{padding:6px 12px 8px;display:grid;gap:8px}
.sq .pill{background:var(--side2);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;color:#fff;border:0;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav{flex:1;overflow:auto;padding:4px 10px 16px}

.ng{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--sideInk);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.ng:hover{background:#ffffff10;color:#fff}
.ng.on{background:var(--side2);color:#fff}
.ng.act{background:var(--pri);color:#fff}
.ng .ch{margin-left:auto;transition:transform .2s;width:15px;height:15px}
.ng.on .ch{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 20px;margin:2px 0 4px 18px;border-left:1px solid #ffffff1c}
.ng.on+.sub{display:block}
.sub a{display:block;padding:6px 10px;border-radius:7px;color:var(--sideInk);text-decoration:none;font-size:13px;cursor:pointer}
.sub a:hover{color:#fff;background:#ffffff10}
.sub a.cur{color:#fff;background:var(--pri);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:60px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
.ib{background:none;border:0;border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--mut);position:relative}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.red:hover{color:var(--bad)}
.gs{position:relative;flex:1;max-width:460px}
.gs input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--inp);padding:0 12px 0 36px}
.gs .i{position:absolute;left:11px;top:10px;color:var(--mut)}
.dd{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:60;max-height:340px;overflow:auto}

.dot{position:absolute;top:2px;right:2px;background:#e11d48;color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.pop{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:300px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:60;overflow:hidden}
.pop h4{padding:10px 14px;border-bottom:1px solid var(--line)}

.pop div.it:hover{background:var(--hover)}
.rel{position:relative}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
#view{flex:1;overflow:auto;padding:18px 20px 28px}
.ph{margin-bottom:14px}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.crumb{color:var(--mut);font-size:13px;margin-top:2px}
footer.ft{flex:none;padding:8px 20px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);background:var(--card)}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:14px}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sin{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--inp);padding:0 11px;min-width:0;width:200px}
.btn{height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm,.mini{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.mini{border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.mini:hover{background:var(--hover)}
.mini.ok{color:var(--ok)}.mini.no{color:var(--bad)}
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{background:var(--hover);text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap;font-weight:700}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--hover)}
.tbl td.empty{text-align:center;color:var(--mut);padding:26px}
.tbl td.act{white-space:nowrap;text-align:right}
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--priSoft);color:var(--pri)}
.bd.ok{background:var(--okSoft);color:var(--ok)}.bd.warn{background:var(--warnSoft);color:var(--warn)}.bd.bad{background:var(--badSoft);color:var(--bad)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mut);font-size:13px;gap:8px;flex-wrap:wrap}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.flt label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--mut)}
.flt select,.flt input{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--inp);padding:0 10px;min-width:140px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr)}
.g3b{grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1fr)}
.stat{border-radius:12px;color:#fff;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;min-width:0;border:0;text-align:left}
.stat .ic{width:52px;height:52px;border-radius:12px;background:#ffffff33;display:grid;place-items:center;flex:none}
.stat .ic svg{width:26px;height:26px}
.stat small{display:block;opacity:.92;font-size:13px}
.stat b{font-size:26px;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sum div{background:var(--hover);border-radius:10px;padding:8px 14px;min-width:120px}
.sum small{display:block;color:var(--mut);font-size:12px}.sum b{font-size:17px;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;display:grid;place-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink)}
.qa button:hover{background:var(--hover);border-color:var(--pri)}
.qa svg{width:22px;height:22px;color:var(--pri)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.months button{border:0;background:var(--hover);border-radius:9px;padding:8px 4px;cursor:pointer;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.months button b{display:block;font-size:12px}.months button span{font-size:12.5px;color:var(--mut)}
.months button.cur{background:var(--pri);color:#fff}.months button.cur span{color:#fff}
.ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.ev .dt{width:46px;border-radius:9px;text-align:center;padding:5px 0;font-weight:800;line-height:1.1;flex:none;background:var(--priSoft);color:var(--pri)}
.ev .dt small{display:block;font-size:11px}
.legend{display:grid;gap:6px;font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
.chartwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
svg text{fill:var(--mut);font-family:var(--font);font-size:11px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(8,14,32,.55);display:grid;place-items:center;z-index:100;padding:16px}
.md{background:var(--card);border-radius:14px;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.md.wide{max-width:820px}.md.xl{max-width:1000px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px}
.mbody{padding:16px 18px;overflow:auto;min-height:0}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:grid;gap:4px;align-content:start;min-width:0}
.fld.span2,.sec{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:700;color:var(--mut)}.fld label b{color:var(--bad)}
.fld input[type=text],.fld input:not([type]),.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=email],.fld input[type=tel],.fld input[type=url],.fld input[type=password],.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--inp);padding:8px 10px;min-height:38px}
.fld textarea{resize:vertical}
.sec{font-size:13px;color:var(--pri);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}.chk label{font-weight:500;color:var(--ink);display:flex;gap:6px;align-items:center}
.photo{display:flex;gap:10px;align-items:center}.photo img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.kv div{font-size:13px}.kv small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px}
.tt{background:#0f1b3d;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600}
.tt.err{background:#b91c1c}.tt.warn{background:#b45309}
/* mega */
.mega{position:fixed;left:264px;top:60px;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:70;overflow:auto;padding:20px 24px;columns:230px 5;column-gap:34px}
.mg{break-inside:avoid;margin-bottom:22px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mg h4{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:6px}
.mg a{display:block;padding:3px 0;color:var(--pri);cursor:pointer;font-size:13px;text-decoration:none}
.mg a:hover{text-decoration:underline}
.mg a::before{content:'» ';opacity:.7}
/* docs */
.doc{background:#fff;color:#111;border:1px solid #ccd;padding:22px;font-family:Georgia,'Times New Roman',serif;margin-bottom:12px;max-width:100%;overflow:auto}
.doc h2{margin:0;text-align:center;font-size:20px}.doc .c{text-align:center;font-size:12px;color:#444}
.doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}.doc th,.doc td{border:1px solid #999;padding:5px 8px;text-align:left}
.doc hr{border:0;border-top:2px solid #111;margin:10px 0}
.doc.cert{border:6px double #1d3a8a;padding:34px;text-align:center}
.doc.cert p{font-size:16px;line-height:1.8}
.idc{display:inline-block;width:230px;border:1px solid #1d3a8a;border-radius:12px;overflow:hidden;margin:6px;background:#fff;color:#111;font-family:var(--font);vertical-align:top}
.idc .h{background:#1d3a8a;color:#fff;padding:8px;text-align:center;font-weight:700;font-size:13px}
.idc .b{padding:10px;text-align:center;font-size:12px;line-height:1.5}
.idc .p{width:70px;height:70px;border-radius:50%;background:#dbe5ff;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#1d3a8a;overflow:hidden}
.idc .p img{width:100%;height:100%;object-fit:cover}
.chat{display:grid;gap:8px;max-height:380px;overflow:auto;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:12px;max-width:80%;white-space:pre-wrap}
.msg.u{background:var(--pri);color:#fff;justify-self:end}.msg.a{background:var(--hover)}
.aifab{position:fixed;right:18px;bottom:50px;z-index:50;background:var(--vio);color:#fff;border:0;border-radius:30px;height:44px;padding:0 18px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.mon{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3b,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  #side{position:fixed;z-index:80;top:0;bottom:0;left:0;margin-left:-270px}
  #side.open{margin-left:0}
  .mega{left:8px;right:8px}
  .fg,.kv,.g2{grid-template-columns:minmax(0,1fr)}
  .gs{display:none}
  .hide-s{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}#view{padding:14px 12px 24px}.sin{width:100%}}
body.collapsed #side{margin-left:-270px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="login" class="login" hidden>

</div>

<script>
'use strict';
/* ================= CORE ================= */
const KEY='ice_school_mgr_v1';
let DB=null;
const S={user:null,route:'dashboard',lang:'en'};
const TS={};const PS=12;const FN={};
const $=(s,r=document)=>r.querySelector(s);

function readForm(root,fields){
  const o={};
  fields.forEach(f=>{
    if(f.sec)return;const el=$('#f_'+f.k,root);if(!el)return;
    switch(f.t||'text'){
      case 'check':o[f.k]=el.checked;break;
      case 'multi':o[f.k]=$$('input:checked',el).map(i=>i.value);break;
      case 'number':o[f.k]=el.value===''?'':Number(el.value);break;
      case 'file':o[f.k]=el.value;o[f.k+'Name']=el.dataset.name||'';break;
      default:o[f.k]=typeof el.value==='string'?el.value.trim():el.value;
    }
  });

    const f=inp.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();const okx=String(DB.settings.fileTypes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);if(okx.length&&!okx.includes(ext)){toast('.'+ext+' files are not allowed (see System Setting > File Types)','err');inp.value='';return}const h=$('#'+inp.dataset.file,m);$('#'+inp.dataset.file+'_n',m).textContent=f.name;h.dataset.name=f.name;

function cellVal(r,c){
  if(c.f)return c.f(r);let v=r[c.k];
  if(c.ref)return esc(nm(c.ref,v));
  if(c.t==='inr')return inr(v);if(c.t==='date')return esc(dmy(v)||'—');if(c.t==='badge')return badge(v);if(c.t==='bool')return v?'Yes':'No';
  if(Array.isArray(v))return esc(v.join(', ')||'—');
  return esc(v==null||v===''?'—':v);
}
function crud(c){
  return host=>{
    const ts=(TS[S.route]=TS[S.route]||{q:'',p:0});
    const recs=()=>{let r=DB[c.store].filter(c.filter||(()=>true));return c.rev?r.slice().reverse():r};
    const cols=c.cols.map(x=>x.l);if(!c.noActions)cols.push('Action');
    host.innerHTML=`${c.top?c.top():''}<div class="card"><div class="ct"><h3>${c.title} <span class="cnt" id="cnt"></span></h3><div class="tools"><input class="sin" placeholder="Search..." value="${esc(ts.q)}" id="cq" aria-label="Search">${c.canAdd!==false?`<button class="btn pri" data-add>${ic('plus',16)} ${c.add||'Add'}</button>`:''}<button class="btn" data-csv>Copy CSV</button></div></div><div id="tb"></div><div class="pg" id="pgr"></div></div>`;
    let allRows=[];
    const draw=()=>{
      const cells=recs().map(r=>({r,cells:c.cols.map(x=>cellVal(r,x))}));
      const q=ts.q.toLowerCase();
      const fl=q?cells.filter(x=>x.cells.join(' ').replace(/<[^>]*>/g,' ').toLowerCase().includes(q)):cells;
      const pages=Math.max(1,Math.ceil(fl.length/PS));if(ts.p>=pages)ts.p=pages-1;
      const pg=fl.slice(ts.p*PS,(ts.p+1)*PS);
      $('#cnt',host).textContent=fl.length;
      allRows=fl.map(x=>x.cells);
      $('#tb',host).innerHTML=tbl(cols,pg.map(x=>{const row=x.cells.slice();if(!c.noActions){row.push(`<div class="act">${c.rowBtns?c.rowBtns(x.r):''}<button class="ib" data-a="edit" data-id="${x.r.id}" title="Edit">${ic('edit',16)}</button>${c.noDelete?'':`<button class="ib red" data-a="del" data-id="${x.r.id}" title="Delete">${ic('trash',16)}</button>`}</div>`)}return row}));
      $('#pgr',host).innerHTML=`<span>Page ${ts.p+1} of ${pages}</span><span><button class="mini" data-pg="-1">Prev</button> <button class="mini" data-pg="1">Next</button></span>`;
    };
    draw();
    const edit=rec=>openForm({title:(rec?'Edit ':'Add ')+(c.sing||c.title),fields:c.fields,rec,wide:c.wide,onSave:v=>{
      if(c.validate){const e=c.validate(v,rec);if(e){toast(e,'err');return false}}
      let r=rec,isNew=!rec;if(rec)Object.assign(rec,v);else{r=Object.assign({id:uid()},v);if(c.init)c.init(r);DB[c.store].push(r)}
      if(c.onSave)c.onSave(r,isNew);audit(isNew?'create':'update',c.store,v.name||v.title||'');persist();toast('Saved');route();}});
    host.onclick=e=>{
      const b=e.target.closest('[data-a],[data-add],[data-csv],[data-pg]');if(!b)return;
      if(b.hasAttribute('data-add'))return edit(null);
      if(b.hasAttribute('data-csv'))return copyText(csvOf(c.cols.map(x=>x.l),allRows));
      if(b.dataset.pg){ts.p=Math.max(0,ts.p+(+b.dataset.pg));return draw()}
      const r=byId(c.store,b.dataset.id);if(!r)return;
      if(b.dataset.a==='edit')edit(r);
      else if(b.dataset.a==='del')confirmBox('Delete this record?',()=>{if(c.beforeDel&&c.beforeDel(r)===false)return;DB[c.store]=DB[c.store].filter(x=>x!==r);audit('delete',c.store,r.name||r.title||'');persist();toast('Deleted');route()});
      else if(c.on&&c.on[b.dataset.a])c.on[b.dataset.a](r);
    };
    $('#cq',host).oninput=e=>{ts.q=e.target.value;ts.p=0;draw()};
  };
}

/* ---- fee engine ---- */
function feeRows(s){
  const rows=[];
  DB.feesMaster.filter(m=>m.classId===s.classId).forEach(m=>rows.push({key:m.id,name:nm('feesTypes',m.typeId)+(m.label?' - '+m.label:''),group:nm('feesGroups',m.groupId),amount:+m.amount,due:m.due,fine:+m.fine||0}));
  DB.carry.filter(c=>c.studentId===s.id).forEach(c=>rows.push({key:'cf'+c.id,name:'Previous balance ('+c.fromSession+')',group:'Carry Forward',amount:+c.amount,due:c.due||'',fine:0}));
  DB.transportAssign.filter(t=>t.studentId===s.id).forEach(t=>{const tf=DB.transportFees.find(x=>x.pickupId===t.pickupId);if(tf)rows.push({key:'tp'+t.id,name:'Transport ('+nm('pickups',t.pickupId)+')',group:'Transport',amount:tf.monthlyFee*tf.months,due:t.due||'',fine:+tf.fine||0})});
  rows.forEach(r=>{const ps=DB.payments.filter(p=>p.studentId===s.id&&p.key===r.key);r.paid=sum(ps,'amount');r.disc=sum(ps,'discount');r.ps=ps;r.bal=Math.max(0,r.amount-r.paid-r.disc);r.late=r.bal>0&&!!r.due&&r.due<todayS();r.status=r.bal===0?'Paid':(r.paid+r.disc>0?'Partial':'Unpaid')});
  return rows;
}
const studentDue=s=>sum(feeRows(s),'bal');
function pendingList(){const t=todayS();return activeStu().map(s=>({s,due:sum(feeRows(s).filter(r=>r.bal>0&&(!r.due||r.due<=t)),'bal')})).filter(x=>x.due>0).sort((a,b)=>b.due-a.due)}
const payTotal=p=>(+p.amount||0)+(+p.fine||0);
function receiptDoc(p){
  const s=byId('students',p.studentId)||{name:'—',admNo:'',father:''};const row=feeRows(s).find(r=>r.key===p.key);
  const html=`<div class="doc">${docHead()}<h2 style="font-size:16px">FEE RECEIPT</h2><table><tr><td>Receipt No.</td><td><b>${esc(p.rc)}</b></td><td>Date</td><td>${esc(dmy(p.date))}</td></tr><tr><td>Student</td><td>${esc(s.name)} (${esc(s.admNo)})</td><td>Class</td><td>${s.classId?esc(clsSec(s)):''}</td></tr><tr><td>Father</td><td>${esc(s.father)}</td><td>Mode</td><td>${esc(p.mode)}</td></tr></table>
  <table><tr><th>Fee</th><th>Amount paid</th><th>Discount</th><th>Fine</th><th>Total</th></tr><tr><td>${esc(row?row.name:'Fee')}</td><td>${inr(p.amount)}</td><td>${inr(p.discount)}</td><td>${inr(p.fine)}</td><td><b>${inr(payTotal(p))}</b></td></tr></table>${p.note?`<div>Note: ${esc(p.note)}</div>`:''}${docFoot()}</div>`;
  const text=`${DB.settings.name} - FEE RECEIPT\nReceipt: ${p.rc}  Date: ${dmy(p.date)}\nStudent: ${s.name} (${s.admNo})\nFee: ${row?row.name:''}\nPaid: ${inr(p.amount)}  Discount: ${inr(p.discount)}  Fine: ${inr(p.fine)}\nTotal: ${inr(payTotal(p))}  Mode: ${p.mode}`;
  docModal('Fee Receipt '+p.rc,html,text);
}

/* ---- charts ---- */
const PAL=['#2563eb','#059669','#f59e0b','#7c3aed','#e11d48','#0891b2','#ea580c','#64748b'];
function barSvg(data,unit){
  const W=480,H=230,L=34,B=28,T=12;const mx=Math.max(1,...data.map(d=>d.v));const nice=Math.max(5,Math.ceil(mx/5)*5);const bw=(W-L-10)/data.length;
  let g='';for(let i=0;i<=4;i++){const y=T+(H-B-T)*(1-i/4);g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(nice*i/4)}</text>`}
  data.forEach((d,i)=>{const h=(H-B-T)*d.v/nice,x=L+i*bw+bw*.2,y=H-B-h;g+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="4" fill="var(--pri)"/><text x="${x+bw*.3}" y="${y-4}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${d.v}</text><text x="${x+bw*.3}" y="${H-10}" text-anchor="middle">${d.l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Admissions per month">${g}</svg>`;
}
function pieSvg(data){
  const tot=sum(data,'v')||1;let a=-Math.PI/2;const R=82,C=90;let g='';
  data.forEach((d,i)=>{const f=d.v/tot,b=a+f*2*Math.PI;const x1=C+R*Math.cos(a),y1=C+R*Math.sin(a),x2=C+R*Math.cos(b),y2=C+R*Math.sin(b);
    g+=f>=.999?`<circle cx="${C}" cy="${C}" r="${R}" fill="${PAL[i%8]}"/>`:`<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${PAL[i%8]}" stroke="var(--card)" stroke-width="2"/>`;
    if(f>.06){const m=(a+b)/2;g+=`<text x="${C+R*.62*Math.cos(m)}" y="${C+R*.62*Math.sin(m)+4}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">${Math.round(f*100)}%</text>`}a=b});
  return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Students per class">${g}</svg>`;
}

function saveStudent(rec,v){

    rec=Object.assign({id:uid(),status:'active',disReason:'',password:'ice@'+v.admNo},v);DB.students.push(rec);DB.cnt.adm++;audit('create','student',v.name)}
  else{Object.assign(rec,v);audit('update','student',v.name)}

function feeDetail(h,s){
  const rows=feeRows(s);
  h.innerHTML=`<div class="card"><div class="ct"><h3>${esc(s.name)} <span class="hint">${esc(s.admNo)} &middot; ${esc(clsSec(s))} &middot; Father: ${esc(s.father)}</span></h3><div class="tools"><button class="btn" data-fn="backCollect">Back</button><button class="btn pri" data-fn="collectAll">Collect all dues in cash</button></div></div>
  ${sumHtml([['Total fees',inr(sum(rows,'amount'))],['Paid',inr(sum(rows,'paid'))],['Discount',inr(sum(rows,'disc'))],['Balance',inr(sum(rows,'bal'))]])}
  ${tbl(['Fee','Group','Due date','Amount','Paid','Discount','Balance','Status','Action'],rows.map(r=>[esc(r.name),esc(r.group),esc(dmy(r.due)||'—'),inr(r.amount),inr(r.paid),inr(r.disc),`<b>${inr(r.bal)}</b>`,badge(r.late?'Overdue':r.status),`<div class="act">${r.bal>0?btn('pay',r.key,'Collect','ok'):''}${r.ps.map(p=>btn('rc',p.id,esc(p.rc))).join('')}</div>`]))}</div>`;
  FN.backCollect=()=>{TS.collect.sid='';route()};
  FN.collectAll=()=>{const due=rows.filter(r=>r.bal>0);if(!due.length)return toast('Nothing to collect','warn');due.forEach(r=>DB.payments.push({id:uid(),rc:'RCPT-'+(DB.cnt.rc++),studentId:s.id,key:r.key,amount:r.bal,discount:0,fine:0,mode:'Cash',date:todayS(),note:'Collected in bulk'}));audit('collect','fees',s.name);persist();toast('Collected '+inr(sum(due,'bal')));route()};
  h.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='rc')return FN.receipt(b.dataset.id);
    const r=rows.find(x=>x.key===b.dataset.id);
    openForm({title:'Collect: '+r.name,fields:[F('amount','Amount','number',{req:true,def:r.bal,min:1,step:'0.01'}),F('discId','Discount','select',{opts:R('feesDisc',null,d=>d.name+' ('+(d.type==='Percent'?d.amount+'%':inr(d.amount))+')')}),F('fine','Fine','number',{def:r.late?r.fine:0,min:0}),F('mode','Payment mode','select',{opts:['Cash','UPI','Card','Cheque','Bank Transfer'],def:'Cash',req:true}),F('date','Date','date',{def:todayS,req:true}),F('note','Note','text',{w:2})],
      onSave:v=>{const d=byId('feesDisc',v.discId);const disc=d?(d.type==='Percent'?Math.round(r.amount*d.amount/100):+d.amount):0;
        if(v.amount+disc>r.bal+0.001){toast('Amount plus discount is more than the balance of '+inr(r.bal),'err');return false}
        const p={id:uid(),rc:'RCPT-'+(DB.cnt.rc++),studentId:s.id,key:r.key,amount:v.amount,discount:disc,fine:v.fine||0,mode:v.mode,date:v.date,note:v.note};DB.payments.push(p);audit('collect','fees',s.name+' '+inr(v.amount));persist();toast('Payment saved');route();receiptDoc(p)}});
  };
}

  return h=>{const ts=TS[S.route]=TS[S.route]||{a:'allstu'};
    h.innerHTML=`<div class="card"><h3>Send ${ch}</h3><p class="hint">Messages are saved to the Email / SMS log. A delivery gateway is not connected yet, so nothing leaves this app.</p><form class="fg" novalidate>
    ${fieldHtml(F('a','Send to','select',{opts:audOpts}),ts.a)}${fieldHtml(F('tpl','Template','select',{opts:R(tplStore,null,t=>t.title)}),'')}${ch==='Email'?fieldHtml(F('sub','Subject','text',{w:2}),''):''}${fieldHtml(F('body','Message','textarea',{w:2}),'')}</form><div id="cnt" class="hint" style="margin:8px 0"></div><button class="btn pri" data-send>Send ${ch}</button></div>`;
    const cnt=()=>$('#cnt',h).textContent=recips($('#f_a',h).value).length+' recipients';cnt();$('#f_a',h).onchange=cnt;
    $('#f_tpl',h).onchange=e=>{const t=byId(tplStore,e.target.value);if(t){$('#f_body',h).value=t.body;if($('#f_sub',h))$('#f_sub',h).value=t.title}};
    $('[data-send]',h).onclick=()=>{const a=$('#f_a',h).value,b=$('#f_body',h).value.trim();if(!b)return toast('Write a message','err');ts.a=a;const rs=recips(a);if(!rs.length)return toast('No recipients','warn');
      rs.forEach(r=>msgLog(ch,r.name,ch==='Email'?r.email:r.phone,$('#f_sub',h)?$('#f_sub',h).value:'',fill(b,r.obj)));audit('send',ch,rs.length+' recipients');persist();toast(rs.length+' '+ch+' messages saved to log')};
  };
}

let CURREP=null;
function report(title,o){
  return h=>{
    const ts=TS[S.route]=TS[S.route]||{from:todayS().slice(0,8)+'01',to:todayS(),month:todayS().slice(0,7)};
    const F2={c:()=>`<label>Class${selHtml('r_c',CLS(),ts.c)}</label>`,s:()=>`<label>Section${selHtml('r_s',SECS(),ts.s)}</label>`,from:()=>`<label>From<input type="date" id="r_from" value="${ts.from}"></label>`,to:()=>`<label>To<input type="date" id="r_to" value="${ts.to}"></label>`,month:()=>`<label>Month<input type="month" id="r_month" value="${ts.month}"></label>`,g:()=>`<label>Exam group${selHtml('r_g',R('examGroups')(),ts.g||'','Select')}</label>`,q:()=>`<label>Search<input id="r_q" value="${esc(ts.q||'')}"></label>`};
    h.innerHTML=`<div class="card"><div class="ct"><h3>${title}</h3><div class="tools"><button class="btn" data-copy>Copy CSV</button></div></div><div class="flt">${(o.f||[]).map(k=>F2[k]()).join('')}<button class="btn pri" data-run>Show report</button></div><div id="repout"></div></div>`;
    let last=null;
    const run=()=>{(o.f||[]).forEach(k=>{const e=$('#r_'+k,h);if(e)ts[k]=e.value});last=o.build(ts);
      $('#repout',h).innerHTML=(last.sum?sumHtml(last.sum):'')+(last.chart||'')+tbl(last.cols,last.rows.slice(0,500),{empty:'No data for this selection'})};
    run();h.onclick=e=>{if(e.target.closest('[data-run]'))run();else if(e.target.closest('[data-copy]'))copyText(csvOf(last.cols,last.rows))};
  };
}

const aiAnswer=q=>{q=q.toLowerCase();const act=activeStu();
  if(/student/.test(q)&&/(how many|total|count|kitne)/.test(q))return `There are ${act.length} active students in ${DB.classes.length} classes.`;
  if(/(pending|due|baki|outstanding)/.test(q)){const p=pendingList();return `Pending fees are ${inr(sum(p,'due'))} from ${p.length} students. Highest: ${p.slice(0,3).map(x=>x.s.name+' '+inr(x.due)).join(', ')||'none'}.`}
  if(/(collect|collection|income)/.test(q)){const ym=todayS().slice(0,7);return `Fees collected this month: ${inr(sum(DB.payments.filter(p=>p.date.startsWith(ym)),payTotal))}. Today: ${inr(sum(DB.payments.filter(p=>p.date===todayS()),payTotal))}.`}
  if(/attendance|present/.test(q)){const a=DB.attendance.filter(x=>x.date===todayS());return a.length?`Today ${a.filter(x=>x.status==='Present').length} of ${a.length} students are present.`:'Attendance has not been marked today.'}
  if(/staff|teacher/.test(q))return `There are ${DB.staff.filter(s=>s.status==='active').length} active staff members.`;
  if(/birthday|janmdin/.test(q)){const md=todayS().slice(5);const b=act.filter(s=>(s.dob||'').slice(5)===md);return b.length?'Birthdays today: '+b.map(s=>s.name).join(', '):'No student birthdays today.'}
  if(/expense|kharch/.test(q))return `Total expenses recorded: ${inr(sum(DB.expenses,'amount'))}.`;
  return 'I can answer questions about student counts, pending fees, fee collection, attendance, staff, birthdays and expenses. Try "pending fees" or "how many students".';};

function route(){
  const id=S.route,view=$('#view'),keep=view.scrollTop;const fn=PAGES[id]||PAGES.dashboard;const m=META[id];
  if(id==='dashboard'){view.innerHTML='';view.onclick=null;try{fn(view)}catch(e){view.innerHTML='<div class="card">Something went wrong: '+esc(e.message)+'</div>';console.error(e)}}

function alerts(){const t=todayS(),a=[];
  const f=DB.enquiries.filter(e=>e.status==='Active'&&e.follow&&e.follow<=t).length;if(f)a.push([f+' enquiry follow-ups due','enquiry']);
  const l=DB.staffLeaves.filter(x=>x.status==='Pending').length+DB.studentLeaves.filter(x=>x.status==='Pending').length;if(l)a.push([l+' leave requests waiting for approval','stuleave']);
  const o=DB.onlineAdm.filter(x=>x.status==='Pending').length;if(o)a.push([o+' online admission applications','onlineadm']);
  const b=DB.bookIssues.filter(i=>!i.ret&&i.due<t).length;if(b)a.push([b+' library books overdue','issue']);
  const c=DB.complaints.filter(x=>x.status==='Pending').length;if(c)a.push([c+' open complaints','complaint']);return a}
function updateBell(){const n=alerts().length;$('#bellBtn').innerHTML=ic('bell')+(n?`<span class="dot">${n}</span>`:'')}
/* global search */
function initSearch(){const i=$('#gsq'),d=$('#gsdd');
  i.oninput=()=>{const q=i.value.trim().toLowerCase();if(q.length<2){d.hidden=true;return}
    const r=DB.students.filter(s=>(s.name+' '+s.admNo+' '+s.rollNo+' '+s.phone+' '+s.father).toLowerCase().includes(q)).slice(0,8);
    d.innerHTML=r.length?r.map(s=>`<div data-fn="gsOpen" data-arg="${s.id}"><b>${esc(s.name)}</b> <small>${esc(s.admNo)} &middot; ${esc(clsSec(s))} &middot; ${esc(s.phone)}</small></div>`).join(''):'<div>No student found</div>';d.hidden=false};
  FN.gsOpen=id=>{d.hidden=true;i.value='';FN.profile(id)}}
document.addEventListener('click',e=>{if(!e.target.closest('.gs'))$('#gsdd').hidden=true;if(!e.target.closest('.rel'))popClose();if(!e.target.closest('#mega')&&!e.target.closest('#qlBtn'))closeMega()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-fn]');if(t){e.preventDefault();const f=FN[t.dataset.fn];f&&f(t.dataset.arg,t,e);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeAllModals();popClose();go(g.dataset.go);closeMega();closeSide()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(MODALS.length)FN.closeModal();else closeMega()}});

/* ================= LOGIN / BOOT ================= */
function applyBrand(){const s=DB.settings;$('#brandName').textContent=s.name;$('#sessPill').textContent='Current Session: '+s.session;$('#foot').textContent='© '+new Date().getFullYear()+' '+s.name+' · Data is stored in this browser';document.title=s.name+' Manager'}
FN.logout=()=>{try{localStorage.removeItem('ice_user')}catch(e){}S.user=null;closeAllModals();popClose();$('#app').hidden=true;showLogin()};
let CAP=null;
function showLogin(){$('#login').hidden=false;$('#app').hidden=true;
  const f=$('#loginForm');let c=$('#capRow');if(c)c.remove();CAP=null;
  if(DB.settings.captcha){CAP=[1+Math.floor(Math.random()*9),1+Math.floor(Math.random()*9)];f.querySelector('.lerr').insertAdjacentHTML('beforebegin',`<div class="fld" id="capRow"><label for="lc">Captcha: ${CAP[0]} + ${CAP[1]} = ?</label><input id="lc" type="text" inputmode="numeric" autocomplete="off"></div>`)}}
function enter(u){S.user=u;try{localStorage.setItem('ice_user',u.username)}catch(e){}
  $('#login').hidden=true;$('#app').hidden=false;$('#userBtn').textContent=u.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  applyBrand();const hh=location.hash.replace('#','');S.route=PAGES[hh]?hh:'dashboard';route();updateBell();}
function boot(){
  loadDB();
  try{const t=localStorage.getItem('ice_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  $('#menuBtn').innerHTML=ic('menu');$('#gsIc').innerHTML=ic('search');$('#themeBtn').innerHTML=ic('moon');$('#calBtn').innerHTML=ic('cal');$('#bellBtn').innerHTML=ic('bell');
  initSearch();
  const aib=document.createElement('button');aib.className='aifab';aib.textContent='Ask ICE (AI) ✦';aib.onclick=()=>go('set_ai');$('#app').appendChild(aib);
  $('#loginForm').onsubmit=e=>{e.preventDefault();const u=DB.users.find(x=>x.username===$('#lu').value.trim()&&x.password===$('#lp').value&&x.active);
    if(CAP&&Number($('#lc').value)!==CAP[0]+CAP[1]){$('#lerr').textContent='Captcha answer is wrong.';showLogin();return}
    if(!u){$('#lerr').textContent='Wrong username or password.';return}
    $('#lerr').textContent='';DB.userLog.push({id:uid(),time:new Date().toISOString().slice(0,19).replace('T',' '),user:u.username,act:'Login'});persist();enter(u)};
  let su=null;try{su=localStorage.getItem('ice_user')}catch(e){}
  const u=su&&DB.users.find(x=>x.username===su&&x.active);
  if(u)enter(u);else showLogin();
}
boot();
</script>
